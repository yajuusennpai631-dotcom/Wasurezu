<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wasurezu — 宿題・提出物管理</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;--p:#5c6ee6;--line:#e5e9f1;--muted:#758096}
*{box-sizing:border-box}body{margin:0}.app{max-width:1050px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{display:flex;gap:12px;align-items:center}.logo{background:var(--p);color:white;font-size:23px;font-weight:800;border-radius:14px;padding:9px 15px}.brand h1{margin:0;font-size:22px}.brand p,.muted{margin:3px 0;color:var(--muted);font-size:12px}.date{font-size:12px;color:var(--muted)}h2{font-size:26px;margin:0 0 5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 7px 22px #23345a0b}.label{color:var(--muted);font-size:12px}.num{font-size:28px;font-weight:750;margin-top:6px}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}.panel{margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.head h3{margin:0;font-size:16px}.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.filter,.secondary{background:white;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;color:#667085;cursor:pointer}.filter.active{background:#eef0ff;color:#4657c8;border-color:#d9ddff}.tasks{display:grid;gap:9px}.task{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px}.task input[type=checkbox]{width:19px;height:19px;accent-color:#21865b;margin-top:2px}.taskbody{flex:1;min-width:0}.tasktitle{font-size:14px;font-weight:650;overflow-wrap:anywhere}.done .tasktitle{text-decoration:line-through;color:#98a1b2}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;font-size:11px;color:var(--muted)}.badge{background:#f0f2f7;padding:4px 7px;border-radius:6px}.late{color:#d94b5b;font-weight:700}.soon{color:#b87814;font-weight:700}.actions button{border:0;background:transparent;color:#8992a4;cursor:pointer;font-size:17px}.empty{text-align:center;color:var(--muted);padding:24px;font-size:13px}form{display:grid;gap:12px}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dfe4ed;border-radius:9px;font:inherit;background:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{border:0;background:var(--p);color:white;font-weight:700;border-radius:10px;padding:12px;cursor:pointer}.primary:hover{background:#4657c8}.note{font-size:11px;color:var(--muted);line-height:1.5}.progress{height:8px;background:#edf0f6;border-radius:9px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#21865b;width:0}.progressline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.tip{background:#eef0ff;color:#4657a8;border-radius:12px;padding:14px;font-size:12px;line-height:1.7}.footer{text-align:center;color:#9aa3b3;font-size:11px;margin-top:18px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:13px}.num{font-size:24px}.layout{grid-template-columns:1fr}.app{padding:16px 12px}.top{align-items:flex-start}.date{text-align:right}h2{font-size:22px}.panel{padding:15px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">W</div><div><h1>Wasurezu</h1><p>宿題・提出物を、忘れずに。</p></div></div><div class="date" id="date"></div></header>
<section><h2 id="greeting">今日やることを確認しよう。</h2><div class="muted">小さな一歩で、提出忘れをゼロに。</div></section>
<section class="stats"><div class="stat"><div class="label">未完了のタスク</div><div class="num" id="open">0</div></div><div class="stat"><div class="label">今日が期限</div><div class="num" id="todayCount">0</div></div><div class="stat"><div class="label">期限切れ</div><div class="num" id="lateCount">0</div></div><div class="stat"><div class="label">完了したタスク</div><div class="num" id="doneCount">0</div></div></section>
<div class="layout"><main><section class="panel"><div class="head"><div><h3>タスク一覧</h3><div class="muted">期限が近いものから表示</div></div><button class="secondary" id="clear">完了済みを整理</button></div><div class="filters" id="filters"><button class="filter active" data-filter="all">すべて</button><button class="filter" data-filter="open">未完了</button><button class="filter" data-filter="today">今日が期限</button><button class="filter" data-filter="late">期限切れ</button><button class="filter" data-filter="done">完了済み</button></div><div class="tasks" id="tasks"></div></section>
<section class="panel"><div class="head"><h3>全タスクの完了率</h3><strong id="pct">0%</strong></div><div class="progress"><div class="bar" id="bar"></div></div><div class="progressline"><span id="doneText">0件完了</span><span id="totalText">0件中</span></div></section></main>
<aside><section class="panel"><div class="head"><div><h3 id="formTitle">タスクを追加</h3><div class="muted">宿題やテストを登録しよう</div></div></div><form id="form"><div class="field"><label for="title">タスク名 *</label><input id="title" maxlength="100" placeholder="例：数学ワーク p.20〜25" required></div><div class="two"><div class="field"><label for="subject">教科</label><select id="subject"><option>その他</option><option>国語</option><option>数学</option><option>英語</option><option>理科</option><option>社会</option><option>体育</option><option>音楽</option><option>美術</option><option>技術・家庭</option><option>総合</option></select></div><div class="field"><label for="kind">種類</label><select id="kind"><option>宿題</option><option>提出物</option><option>テスト</option><option>持ち物</option><option>その他</option></select></div></div><div class="field"><label for="due">期限 *</label><input id="due" type="date" required></div><div class="field"><label for="notes">メモ（任意）</label><textarea id="notes" rows="2" maxlength="300" placeholder="ページ数、提出方法など"></textarea></div><button class="primary" id="submit" type="submit">＋ タスクを追加</button><button class="secondary" id="cancel" type="button" hidden>編集をキャンセル</button><div class="note">内容はこのブラウザに保存されます。今のバージョンでは端末間の同期はありません。</div></form></section><div class="tip"><b>ちょっとしたコツ</b><br>大きな宿題は「ワークを5ページ進める」のように小さく分けると、取り組みやすくなります。</div></aside></div><div class="footer">Wasurezu · 宿題・提出物管理</div></div>
<script>
const KEY='wasurezu_tasks_v1';let data=[],filter='all',editId=null;const $=id=>document.getElementById(id);
const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateText=s=>{let [y,m,d]=s.split('-').map(Number);return m+'月'+d+'日'};
const late=t=>!t.done&&t.due<today();
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function render(){let open=data.filter(t=>!t.done),done=data.filter(t=>t.done);$('open').textContent=open.length;$('todayCount').textContent=open.filter(t=>t.due===today()).length;$('lateCount').textContent=open.filter(late).length;$('doneCount').textContent=done.length;let pct=data.length?Math.round(done.length/data.length*100):0;$('pct').textContent=pct+'%';$('bar').style.width=pct+'%';$('doneText').textContent=done.length+'件完了';$('totalText').textContent=data.length+'件中';
let list=data.filter(t=>filter==='all'?true:filter==='open'?!t.done:filter==='today'?!t.done&&t.due===today():filter==='late'?late(t):t.done).sort((a,b)=>Number(a.done)-Number(b.done)||a.due.localeCompare(b.due));
$('tasks').innerHTML=list.length?list.map(t=>'<article class="task '+(t.done?'done':'')+'"><input type="checkbox" data-action="toggle" data-id="'+t.id+'" '+(t.done?'checked':'')+' aria-label="完了"><div class="taskbody"><div class="tasktitle">'+esc(t.title)+'</div><div class="meta"><span class="badge">'+esc(t.subject)+'</span><span class="badge">'+esc(t.kind)+'</span><span class="'+(late(t)?'late':t.due===today()&&!t.done?'soon':'')+'">'+(t.done?'完了':dateText(t.due)+' · '+(late(t)?'期限切れ':t.due===today()?'今日まで':t.due===tomorrow()?'明日まで':'期限あり'))+'</span></div>'+(t.notes?'<div class="meta">'+esc(t.notes)+'</div>':'')+'</div><div class="actions"><button data-action="edit" data-id="'+t.id+'" title="編集">✎</button><button data-action="delete" data-id="'+t.id+'" title="削除">×</button></div></article>').join(''):'<div class="empty">この一覧にタスクはありません。<br>右側から新しいタスクを追加できます。</div>'}
function tomorrow(){let d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function reset(){ $('form').reset();editId=null;$('formTitle').textContent='タスクを追加';$('submit').textContent='＋ タスクを追加';$('cancel').hidden=true;$('due').value=today()}
$('filters').addEventListener('click',e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});
$('tasks').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let t=data.find(x=>x.id===b.dataset.id);if(!t)return;if(b.dataset.action==='toggle'){t.done=b.checked;save()}else if(b.dataset.action==='delete'){if(confirm('このタスクを削除しますか？')){data=data.filter(x=>x.id!==t.id);save()}}else if(b.dataset.action==='edit'){editId=t.id;$('title').value=t.title;$('subject').value=t.subject;$('kind').value=t.kind;$('due').value=t.due;$('notes').value=t.notes||'';$('formTitle').textContent='タスクを編集';$('submit').textContent='変更を保存';$('cancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}});
$('form').addEventListener('submit',e=>{e.preventDefault();let item={title:$('title').value.trim(),subject:$('subject').value,kind:$('kind').value,due:$('due').value,notes:$('notes').value.trim()};if(!item.title||!item.due)return;if(editId){let t=data.find(x=>x.id===editId);if(t)Object.assign(t,item)}else data.push({...item,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),done:false});reset();save()});
$('cancel').addEventListener('click',reset);$('clear').addEventListener('click',()=>{let n=data.filter(t=>t.done).length;if(!n){alert('完了済みタスクはありません。');return}if(confirm('完了済みの'+n+'件を削除しますか？')){data=data.filter(t=>!t.done);save()}});
let now=new Date();$('date').textContent=now.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('greeting').textContent=now.getHours()<11?'おはよう。今日やることを確認しよう。':now.getHours()<17?'今日やることを確認しよう。':'今日もおつかれさま。残りを確認しよう。';
try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{data=[]}if(!data.length){data=[{id:'demo1',title:'数学ワーク p.20〜25',subject:'数学',kind:'宿題',due:today(),notes:'例題も解き直す',done:false},{id:'demo2',title:'英単語を20個覚える',subject:'英語',kind:'宿題',due:today(),notes:'',done:false},{id:'demo3',title:'理科レポートを提出',subject:'理科',kind:'提出物',due:tomorrow(),notes:'実験結果と考察を書く',done:false}]}reset();render();
</script></body></html>
